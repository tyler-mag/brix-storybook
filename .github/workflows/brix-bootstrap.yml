name: Bootstrap Brix repository

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/brix-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Reassemble and unpack verified Brix source
        run: |
          cat brix-source-b64-*.txt | base64 --decode > brix-source.tgz
          tar -xzf brix-source.tgz
      - name: Replace bootstrap files with project source
        run: |
          rm brix-source.tgz brix-source-b64-*.txt .github/workflows/brix-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Brix Storybook source"
          git push
